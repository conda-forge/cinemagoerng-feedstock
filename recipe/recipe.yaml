schema_version: 1

context:
  name: cinemagoerng
  version: "0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/cinemagoer/cinemagoerng/archive/v${{ version }}.tar.gz
  sha256: 284f25bf3b0a3b470058a12a723dc8f31b31bb2acdcb043ae52e8d5c9a530896

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cinemagoerng = cinemagoerng:cli.main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - typedload >=2.39,<3.dev0
    - lxml >=5.4.0,<5.5.dev0
    - jmespath >=1.0.1,<1.1.dev0

tests:
  - python:
      imports:
        - cinemagoerng
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - cinemagoerng --help

about:
  summary: Retrieve data from the IMDb.
  license: LGPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/cinemagoer/cinemagoerng
  repository: https://github.com/cinemagoer/cinemagoerng

extra:
  recipe-maintainers:
    - HeavyTony2
